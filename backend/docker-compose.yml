services:
  db:
    image: postgres:16-alpine
    container_name: libraryconnect-db
    environment:
      POSTGRES_DB: libraryconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libraryconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: libraryconnect-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/libraryconnect
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  